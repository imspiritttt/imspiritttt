<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="90" viewBox="0 0 1200 90">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <style>
      .bye { font: 400 16px 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace; fill: #6a6a6a; }
    </style>
  </defs>
  <rect width="1200" height="90" fill="#000000"/>
  <rect width="1200" height="90" filter="url(#grain)" opacity="0.07"/>
  <path d="M72 34 C200 31 330 38 460 33" fill="none" stroke="#3a3a3a" stroke-width="2" stroke-linecap="round"/>
  <text class="bye" x="72" y="64">see ya.</text>
</svg>
