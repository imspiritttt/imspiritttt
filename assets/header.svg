<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="vignette" cx="0.3" cy="0.45" r="0.9">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000000"/>
    </radialGradient>
    <style>
      .name { font: 800 76px 'Segoe UI', 'Helvetica Neue', 'Noto Sans', Arial, sans-serif; fill: #ececec; letter-spacing: -1px; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { fill-opacity: 0; } }
      .tag { font: 400 22px 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace; fill: #8a8a8a; }
      .side { font: 400 15px 'Cascadia Code', 'Fira Code', 'Consolas', 'Menlo', monospace; fill: #4a4a4a; letter-spacing: 1px; }
      .scribble { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 1.6s 0.3s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="1200" height="260" fill="url(#vignette)"/>
  <rect width="1200" height="260" filter="url(#grain)" opacity="0.07"/>

  <text class="name" x="72" y="130">imspiritttt<tspan class="cursor">_</tspan></text>
  <path class="scribble" d="M78 150 C140 146 200 157 262 149 S380 144 446 153 C452 154 456 156 452 158" fill="none" stroke="#d6d6d6" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  <text class="tag" x="78" y="198">just building stuff.</text>

  <text class="side" x="1128" y="232" text-anchor="end">brazil · discord bots · lol cards</text>
</svg>
