name: Generate snake

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#111111&color_dots=#ebedf0,#c4c4c4,#9a9a9a,#666666,#333333
            dist/snake-dark.svg?palette=github-dark&color_snake=#ececec&color_dots=#161b22,#2b2b2b,#4d4d4d,#7a7a7a,#b3b3b3

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
